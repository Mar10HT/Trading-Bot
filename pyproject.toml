[project]
name = "trade-bot"
version = "0.1.0"
description = "Grid trading bot for Binance crypto markets"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0,<5.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "aiosqlite>=0.19,<1.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "websockets>=12.0,<14.0",
    "structlog>=24.0,<26.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.0,<3.0",
    "click>=8.0,<9.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
trade-bot = "src.main:cli"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101", # assert used in tests
    "S105", # hardcoded password — false positives on variable names
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
